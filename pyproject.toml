[project]
name = "meta-coder"
version = "0.1.0"
description = "Local browser app for LLM-assisted meta-analysis moderator coding"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
meta-coder = "meta_coder.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meta_coder*"]

[tool.setuptools.package-data]
meta_coder = ["templates/*.html", "static/*", "config/*.yml"]
