name: affordance_compatibility_meta_analysis
description: >
  Meta-analysis of the affordance/stimulus-response compatibility effect: studies
  where participants respond to graspable objects (e.g. mugs, tools) whose handle
  orientation is either compatible or incompatible with the responding hand/key.

effect_definition: >
  The affordance compatibility effect: the difference in response time (and/or
  accuracy) between trials where the participant's response corresponds
  ("compatible") to the graspable orientation of a presented object — e.g. its
  handle points toward the responding hand or response key — and trials where it
  does not ("incompatible"). Each coding sheet row is one such compatible-vs-
  incompatible contrast reported for one experiment or sample within the article.

coding_sheet_fields:
  # Already known from the meta-analysis roster — never asked of the LLM.
  paper_id:
    type: integer
    description: Paper ID in the meta-analysis roster.
  sample_number:
    type: string
    description: Sample identifier (e.g. S1, S2) when a paper reports more than one sample.
  effect_letter:
    type: string
    description: Letter identifying this effect within the paper (e.g. A, B).
  doi:
    type: string

effects:
  # --- Sample ---
  Age:
    type: string
    description: >
      Mean age of participants in years, if disclosed. If only described as a
      student sample with no numeric mean given, use "S".
  Gender:
    type: number
    description: >
      Proportion of male participants out of the total (e.g. 0.5). If reported only
      for the overall sample and not per subgroup, use the overall-sample ratio for
      this effect too.
  Handedness:
    type: number
    description: >
      Proportion of right-handed participants out of the total. Same overall-sample
      fallback rule as Gender.
  SampleSize:
    type: integer
    required: true
    description: >
      Number of participants included in the analysis for this specific effect
      (e.g. if 23 were recruited but only 20 analysed, use 20). May be derived from
      degrees of freedom if N isn't stated directly.

  # --- Response setup ---
  ResponseMode:
    type: string
    levels:
      - value: Within-hand
        description: Both response options were made with two fingers/keys of the same hand.
      - value: Between-hand
        description: Each response option used a different hand.
  BetweenKeyDistanceMm:
    type: string
    description: >
      Distance in mm between the two response options. If they are keys on a
      keyboard, name the keys (e.g. "Y and 7") in addition to the distance if given.
  HandsCrossed:
    type: string
    levels:
      - value: Uncrossed
        description: Participants' hands were not crossed at the time of responding.
      - value: Crossed
        description: Participants' hands were crossed at the time of responding.
  ViewingDistanceCm:
    type: number
    description: Distance of participants' eyes from the monitor, in cm.
  HandScreenDistance:
    type: string
    description: >
      Distance of the hands from the monitor/screen at the time of response, in the
      unit reported. If hands rested on a table with no specific distance given, use
      "On table (unspecified)". If the response was a reach or other action away
      from the body with no distance given, use "Reach (unspecified)".

  # --- Instructions given to participants ---
  SpeedInstruction:
    type: boolean
    description: Participants were told to respond as fast as possible.
  AccuracyInstruction:
    type: boolean
    description: Participants were told to respond as accurately as possible.
  OrientationInstruction:
    type: boolean
    description: Participants were told to ignore the object's horizontal orientation.
  FunctionalInstruction:
    type: string
    levels:
      - value: Not mentioned
        description: No mention of the object's graspable/functional nature.
      - value: Told explicitly
        description: >
          Participants were explicitly and intentionally made aware of the object's
          graspable nature, or that it was a tool.
      - value: Asked to imagine using them
        description: Participants were asked to imagine using the objects.

  # --- Task design ---
  DecisionType:
    type: string
    levels:
      - value: Upright/inverted
        description: Participants decide whether the object is upright or inverted.
      - value: Colour
        description: Participants respond according to the object's colour.
      - value: Functional categorisation
        description: >
          Participants decide whether the object fits one of two categories relevant
          to its use, shape, or composition (e.g. tool vs food, round vs square).
      - value: Other
        description: A categorisation that doesn't fit the above — describe it in evidence.
  DecisionTarget:
    type: string
    levels:
      - value: Object
        description: Participants respond to an aspect of the object itself.
      - value: Other on-screen element
        description: Participants respond to something else on screen (e.g. a number).
  Mapping:
    type: string
    levels:
      - value: One
        description: >
          Participants completed only one stimulus-response mapping throughout
          (e.g. always a left-handed response for blue stimuli).
      - value: Alternating
        description: The stimulus-response mapping alternated within participants.
  StimulusType:
    type: string
    levels:
      - value: Photographs
      - value: Silhouettes
        description: No depth information.
      - value: Illustration
      - value: Other
  NumberOfStimuli:
    type: integer
    description: >
      Number of unique objects used in the task. Variations of the same item (e.g. a
      blue cup and a red cup) count as one stimulus.
  BrokenObjects:
    type: string
    levels:
      - value: "No"
        description: The handles of the presented stimuli are intact.
      - value: "Yes"
        description: The handles of the presented stimuli are broken.
      - value: Part-object
        description: The stimulus is just a part of an object (e.g. a door-knob).
  Presentation:
    type: string
    levels:
      - value: Central
      - value: Left/right
      - value: Central and left/right
    description: If not explicitly stated, use the figures/appendix to determine this.

  # --- Trial structure ---
  PracticeTrials:
    type: integer
    description: Number of practice trials completed.
  Blocks:
    type: integer
    description: >
      Number of blocks of trials completed for the effect being coded (e.g. if one
      block was hands-crossed and one uncrossed, the uncrossed effect is coded as 1
      block).
  TrialsPerBlock:
    type: integer
    description: Number of trials per block for the effect being coded.
  TotalTrials:
    type: integer
    description: Total trials for the effect being coded (Blocks x TrialsPerBlock).
  FixationDurationMs:
    type: number
    description: Fixation duration in ms.
  IntertrialTimeMs:
    type: number
    description: >
      Any time between trials that is not fixation or feedback time (e.g. a blank
      screen or delay), in ms.
  PresentationTimeMs:
    type: number
    description: Time for which stimuli were presented, in ms.
  ResponseWindowMs:
    type: number
    description: How long participants had to respond, in ms.
  Mask:
    type: boolean
    description: Whether the stimuli were masked by another image.
  ResponsePeriod:
    type: string
    levels:
      - value: During presentation
        description: Participants responded while the stimulus was still on screen.
      - value: After offset
        description: Participants responded after the stimulus disappeared.
  TrialFeedback:
    type: string
    levels:
      - value: No feedback
      - value: Feedback for errors only
        description: Text or sound feedback given only for incorrect responses.
      - value: Feedback for all responses
  FeedbackDurationMs:
    type: number
    description: Duration of feedback presentation, in ms, if feedback was given.

  # --- The focal effect data itself ---
  ResponseTimeCompatibleMs:
    type: number
    description: Mean response time in the compatible condition, in ms.
  ResponseTimeCompatibleSD:
    type: number
    description: SD (or SE — note which in evidence) of response time in the compatible condition.
  ResponseTimeIncompatibleMs:
    type: number
    description: Mean response time in the incompatible condition, in ms.
  ResponseTimeIncompatibleSD:
    type: number
    description: SD (or SE — note which in evidence) of response time in the incompatible condition.
  ResponseTimeDifferenceMs:
    type: number
    description: >
      Incompatible minus compatible mean response time, in ms, only if directly
      reported as such in the article (do not compute it yourself).
  TStatistic:
    type: string
    description: >
      The reported t-test result for the compatibility effect, exactly as printed
      (e.g. "t(11) = 4.20, p = .001"), if one is reported.
  FStatistic:
    type: string
    description: >
      The reported F-test result for the compatibility effect, exactly as printed
      (e.g. "F(1, 11) = 17.6, p = .002"), if one is reported.
