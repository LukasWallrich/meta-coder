name: untitled_meta_analysis
description: Describe this meta-analysis in a sentence or two.

effect_definition: >
  State what comparison counts as "the effect" for this meta-analysis, e.g.
  "the difference in response times between compatible and incompatible trials."
  Every field description below should read as relative to this comparison.

coding_sheet_fields:
  # Supplied by the coding sheet (one row per effect-instance) and never sent to
  # the model — rejoined into the output at collation time. Add whatever columns
  # your coding sheet CSV provides beyond row_id/source_pdf/locator.
  authors: {type: string}
  year: {type: integer}

effects:
  # Coded by the LLM, one object per coding sheet row. Replace this example field.
  ExampleModerator:
    type: string
    required: true
    description: Replace with a real field description.
    levels:
      - value: Example level A
        description: What distinguishes this level.
      - value: Example level B
        description: What distinguishes this level.
