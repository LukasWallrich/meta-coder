name: untitled_meta_analysis
description:

# Required — left blank on purpose. There's no generic default that means
# anything for an arbitrary meta-analysis, so this must stay empty (and the
# manual stays invalid) until you state what comparison counts as "the
# effect" here, e.g. "the difference in response times between compatible
# and incompatible trials." Every field description below should read as
# relative to this comparison.
effect_definition:

effects:
  # Coded by the LLM, one object per coding sheet row. Example of a real,
  # fully-specified field — replace or add to it with fields of your own.
  Publication status:
    type: string
    description: Whether the study report was published in a peer-reviewed venue.
    levels:
      - value: Published
        description: Appeared in a peer-reviewed journal or proceedings.
      - value: Unpublished
        description: Preprint, thesis, dissertation, or other non-peer-reviewed source.
